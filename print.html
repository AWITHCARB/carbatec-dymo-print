<head>
    <meta charset="UTF-8">
    <title>DYMO Print Diagnostic</title>

    <script src="https://qajavascriptsdktests.azurewebsites.net/JavaScript/dymo.connect.framework.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        button {
            font-size: 18px;
            padding: 12px 24px;
            cursor: pointer;
        }

        #status {
            white-space: pre-wrap;
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border: 1px solid #ccc;
            min-height: 300px;
        }
    </style>
</head>

<body>

<h2>DYMO Print Diagnostic</h2>

<button onclick="testPrint()">
    RUN PRINT TEST
</button>

<div id="status">Ready.</div>

<script>

const QR_URL =
    "https://apps.powerapps.com/play/e/default-ae1be686-858c-487b-9303-c0b1d0ffb8a5/a/c4863ba1-b38c-48df-ac6e-7d3628bd937a?tenantId=ae1be686-858c-487b-9303-c0b1d0ffb8a5&hint=db3ebc0b-3285-4ede-afd9-98f04700fd4b&sourcetime=1790213182302&itemId=6";

const MACHINE_ID = "BM-006";

const LABEL_XML = `<?xml version="1.0" encoding="utf-8"?>
<DieCutLabel Version="8.0" Units="twips">
    <PaperOrientation>Landscape</PaperOrientation>
    <Id>LargeAddress</Id>
    <IsOutlined>false</IsOutlined>
    <PaperName>30321 Large Address</PaperName>

    <DrawCommands>
        <RoundRectangle X="0" Y="0" Width="2025" Height="5020" Rx="270" Ry="270" />
    </DrawCommands>

    <ObjectInfo>
        <BarcodeObject>
            <Name>QRCode</Name>
            <ForeColor Alpha="255" Red="0" Green="0" Blue="0" />
            <BackColor Alpha="0" Red="255" Green="255" Blue="255" />
            <LinkedObjectName />
            <Rotation>Rotation0</Rotation>
            <IsMirrored>False</IsMirrored>
            <IsVariable>False</IsVariable>
            <GroupID>-1</GroupID>
            <IsOutlined>False</IsOutlined>
            <Text>URL:https://apps.powerapps.com/</Text>
            <Type>QRCode</Type>
            <Size>Large</Size>
            <TextPosition>None</TextPosition>
            <TextFont Family="Arial" Size="8" Bold="False" Italic="False" Underline="False" Strikeout="False" />
            <CheckSumFont Family="Arial" Size="8" Bold="False" Italic="False" Underline="False" Strikeout="False" />
            <TextEmbedding>None</TextEmbedding>
            <ECLevel>0</ECLevel>
            <HorizontalAlignment>Center</HorizontalAlignment>
            <QuietZonesPadding Left="0" Top="0" Right="0" Bottom="0" />
        </BarcodeObject>

        <Bounds X="322" Y="57.9999999999999" Width="2130" Height="1882" />
    </ObjectInfo>

    <ObjectInfo>
        <TextObject>
            <Name>ID_Text</Name>
            <ForeColor Alpha="255" Red="0" Green="0" Blue="0" />
            <BackColor Alpha="0" Red="255" Green="255" Blue="255" />
            <LinkedObjectName />
            <Rotation>Rotation0</Rotation>
            <IsMirrored>False</IsMirrored>
            <IsVariable>False</IsVariable>
            <GroupID>-1</GroupID>
            <HorizontalAlignment>Center</HorizontalAlignment>
            <VerticalAlignment>Middle</VerticalAlignment>
            <TextFitMode>ShrinkToFit</TextFitMode>
            <UseFullFontHeight>True</UseFullFontHeight>
            <Verticalized>False</Verticalized>

            <StyledText>
                <Element>
                    <String xml:space="preserve">BM-006</String>
                    <Attributes>
                        <Font Family="Arial" Size="28" Bold="False" Italic="False" Underline="True" Strikeout="False" />
                        <ForeColor Alpha="255" Red="0" Green="0" Blue="0" HueScale="100" />
                    </Attributes>
                </Element>
            </StyledText>
        </TextObject>

        <Bounds X="2250" Y="630" Width="2655" Height="720" />

            <LinkedObjectName />
            <Rotation>Rotation0</Rotation>
            <IsMirrored>False</IsMirrored>
            <IsVariable>False</IsVariable>
            <GroupID>-1</GroupID>
            <HorizontalAlignment>Center</HorizontalAlignment>
            <VerticalAlignment>Middle</VerticalAlignment>

            <UseFullFontHeight>True</UseFullFontHeight>

            <StyledText>
                <Element>
                    <String xml:space="preserve">Carbatec Machine</String>
                    <Attributes>
                        <Font Family="Arial" Size="28" Bold="False" Italic="False" Underline="False" Strikeout="False" />
                        <ForeColor Alpha="255" Red="0" Green="0" Blue="0" HueScale="100" />
                    </Attributes>
                </Element>
            </StyledText>
        </TextObject>

        <Bounds X="2265" Y="57.9999999999999" Width="2655" Height="572" />
    </ObjectInfo>

</DieCutLabel>`;


function setStatus(text) {
    document.getElementById("status").innerText = text;
}


function waitForDYMO() {

    return new Promise(function(resolve, reject) {

        let attempts = 0;

        const timer = setInterval(function() {

            attempts++;

            try {

                const environment =
                    dymo.label.framework.checkEnvironment();

                console.log(
                    "Discovery check " + attempts,
                    environment
                );

                if (
                    environment.isWebServicePresent &&
                    environment.isFrameworkInstalled
                ) {

                    clearInterval(timer);

                    resolve(environment);

                    return;
                }

            }
            catch (error) {

                console.log(
                    "Waiting for DYMO...",
                    error
                );
            }

            if (attempts >= 30) {

                clearInterval(timer);

                reject(
                    new Error(
                        "DYMO service discovery did not complete within 15 seconds."
                    )
                );
            }

        }, 500);

    });

}


async function testPrint() {

    try {

        setStatus(
            "STEP 1 — Starting DYMO..."
        );

        if (typeof dymo === "undefined") {

            throw new Error(
                "DYMO is not defined."
            );
        }

        dymo.label.framework.init();

        setStatus(
            "STEP 1 — DYMO initialised.\n\n" +
            "STEP 2 — Waiting for service discovery..."
        );

        await waitForDYMO();

        /*
         * The successful diagnostic previously reached this point.
         * Give the framework a little extra time before asking
         * for the printers.
         */

        setStatus(
            "STEP 2 — DYMO service discovered.\n\n" +
            "Waiting 2 seconds for printer discovery..."
        );

        await new Promise(function(resolve) {
            setTimeout(resolve, 2000);
        });

        setStatus(
            "STEP 2 — Printer discovery should now be complete.\n\n" +
            "STEP 3 — Getting printers..."
        );

        const printers =
            await dymo.label.framework.getPrintersAsync();

        console.log(
            "PRINTER RESULT:",
            printers
        );

        if (
            !printers ||
            !printers.byIndex ||
            printers.byIndex.length === 0
        ) {

            throw new Error(
                "STEP 3 FAILED — getPrintersAsync() returned no printers."
            );
        }

        let printer = null;

        for (
            let i = 0;
            i < printers.byIndex.length;
            i++
        ) {

            console.log(
                "Printer " + i,
                printers.byIndex[i]
            );

            if (
                printers.byIndex[i].name ===
                "DYMO LabelWriter 450"
            ) {

                printer =
                    printers.byIndex[i];

                break;
            }
        }

        if (!printer) {

            throw new Error(
                "STEP 3 FAILED — DYMO LabelWriter 450 was not found."
            );
        }

        setStatus(
            "STEP 3 — Printer found!\n\n" +
            "Name: " +
            printer.name +
            "\n" +
            "Model: " +
            printer.modelName +
            "\n" +
            "Connected: " +
            printer.isConnected +
            "\n\n" +
            "STEP 4 — Opening label..."
        );


        let label;

        try {

            label =
                dymo.label.framework.openLabelXml(
                    LABEL_XML
                );

        }
        catch (error) {

            throw new Error(
                "STEP 4 FAILED — openLabelXml():\n" +
                error.message
            );
        }


        setStatus(
            "STEP 3 — Printer found!\n\n" +
            "STEP 4 — Label opened successfully.\n\n" +
            "STEP 5 — Setting QR code..."
        );


        try {

            label.setObjectText(
                "QRCode",
                "URL:" + QR_URL
            );

        }
        catch (error) {

            throw new Error(
                "STEP 5 FAILED — QRCode:\n" +
                error.message
            );
        }


        try {

            label.setObjectText(
                "ID_Text",
                MACHINE_ID
            );

        }
        catch (error) {

            throw new Error(
                "STEP 5 FAILED — ID_Text:\n" +
                error.message
            );
        }


        try {

            label.setObjectText(
                "Brand_Text",
                "Carbatec Machine"
            );

        }
        catch (error) {

            throw new Error(
                "STEP 5 FAILED — Brand_Text:\n" +
                error.message
            );
        }


        setStatus(
            "STEP 4 — Label opened successfully.\n\n" +
            "STEP 5 — All three label objects updated.\n\n" +
            "STEP 6 — Preparing print..."
        );


        const finalXml =
            label.toString();


        console.log(
            "FINAL LABEL XML:",
            finalXml
        );


        try {

            dymo.label.framework.printLabel(
                printer.name,
                "",
                finalXml,
                ""
            );

        }
        catch (error) {

            throw new Error(
                "STEP 6 FAILED — printLabel():\n" +
                error.message
            );
        }


        setStatus(
            "SUCCESS!\n\n" +
            "Print command sent to:\n" +
            printer.name +
            "\n\n" +
            "Machine: " +
            MACHINE_ID
        );

    }
    catch (error) {

        console.error(
            "DYMO TEST ERROR:",
            error
        );

        setStatus(
            "ERROR\n\n" +
            error.message +
            "\n\n" +
            "Open F12 → Console for the full error."
        );
    }

}

</script>
