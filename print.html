/*
 * ============================================================
 * WAIT FOR DYMO SERVICE
 * ============================================================
 */

function waitForDYMO() {

    return new Promise(function(resolve, reject) {

        let attempts = 0;

        const timer = setInterval(function() {

            attempts++;

            try {

                const environment =
                    dymo.label.framework.checkEnvironment();

                console.log(
                    "Discovery check " + attempts,
                    environment
                );

                if (
                    environment.isWebServicePresent &&
                    environment.isFrameworkInstalled
                ) {

                    clearInterval(timer);

                    resolve(environment);

                    return;
                }

            }
            catch (error) {

                console.log(
                    "Waiting for DYMO...",
                    error
                );

            }

            if (attempts >= 30) {

                clearInterval(timer);

                reject(
                    new Error(
                        "DYMO service discovery did not complete within 15 seconds."
                    )
                );

            }

        }, 500);

    });

}
